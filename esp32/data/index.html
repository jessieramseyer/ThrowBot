<!DOCTYPE HTML><html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/modules/heatmap.js"></script>
  <style>
    body {
      min-width: 310px;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    h2 {
      font-family: Arial;
      font-size: 2.5rem;
      text-align: center;
    }
    .container {
      height: 400px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h2>ToF Sensor Data</h2>
  <div id="heatmap-distance" class="container"></div>
</body>
<script>
function createHeatmapData(values) {
  const data = [];
  for (let i = 0; i < 8; i++) {
    for (let j = 0; j < 8; j++) {
      data.push([j, i, values[i * 8 + j]]);
    }
  }
  return data;
}

var heatmap = Highcharts.chart('heatmap-distance', {
  chart: {
    type: 'heatmap'
  },
  title: {
    text: 'ToF Distance Heatmap'
  },
  xAxis: {
    title: null,
    labels: {enabled: false}
  },
  yAxis: {
    title: null,
    labels: {enabled: false}
  },
  colorAxis: {
    min: 0,
    max: 1500,
    stops: [
      [0,   '#ff0000'],    // Red for close distances
      [0.5, '#00ff00'],  // Green for middle distances
      [1,   '#0000ff']     // Blue for far distances
    ]
  },
  series: [{
    name: 'Distance',
    borderWidth: 1,
    data: Array(64).fill(0).map((_, i) => [i % 8, Math.floor(i / 8), 0]),
    dataLabels: {
      enabled: true,
      format: '{point.value}'
    }
  }],
  tooltip: {
    formatter: function () {
      return `Distance: ${this.point.value} mm`;
    }
  },
  legend: {
    align: 'right',
    layout: 'vertical',
    margin: 0,
    verticalAlign: 'top',
    y: 25,
    symbolHeight: 280
  }
});

setInterval(function () {
  var xhttp = new XMLHttpRequest();
  xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
      try {
        const values = JSON.parse(this.responseText);
        heatmap.series[0].setData(createHeatmapData(values));
      } catch (e) {
        console.error("Error parsing ToF data:", e);
      }
    }
  };
  xhttp.open("GET", "/tof_data", true);
  xhttp.send();
}, 1000);
</script>
</html>
